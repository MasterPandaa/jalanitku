<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MASKOT NETWORK ENGINEER — "THE CONNECTOR" -->
  <!-- Proyek: JalanITku · Sutradara Visual: Matatabi -->

  <!-- Sepatu Safety Kabel -->
  <rect x="66" y="162" width="22" height="24" fill="#0A0A0A" />
  <rect x="112" y="162" width="22" height="24" fill="#0A0A0A" />
  <rect x="62" y="160" width="22" height="24" fill="#0A0A0A" rx="2" />
  <rect x="108" y="160" width="22" height="24" fill="#0A0A0A" rx="2" />
  <line x1="62" y1="180" x2="84" y2="180" stroke="#00F0FF" stroke-width="3" />
  <line x1="108" y1="180" x2="130" y2="180" stroke="#00F0FF" stroke-width="3" />

  <!-- Hard Shadow Badan -->
  <rect x="46" y="52" width="112" height="110" rx="10" fill="#0A0A0A" />

  <!-- Badan Utama Rambu (Kuning Kabel #FFD60A) -->
  <rect x="38" y="44" width="112" height="110" rx="10" fill="#FFD60A" stroke="#0A0A0A" stroke-width="5" stroke-linejoin="round" />

  <!-- Garis Bus Jaringan Dekoratif -->
  <line x1="48" y1="142" x2="140" y2="142" stroke="#0A0A0A" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Antena Router Kembar & Gelombang Wi-Fi -->
  <line x1="66" y1="44" x2="62" y2="14" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" />
  <circle cx="62" cy="12" r="6" fill="#00F0FF" stroke="#0A0A0A" stroke-width="3" />
  <line x1="126" y1="44" x2="130" y2="14" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" />
  <circle cx="130" cy="12" r="6" fill="#00F0FF" stroke="#0A0A0A" stroke-width="3" />
  <g transform="translate(0, -6)">
    <path d="M 80,18 Q 96,6 112,18" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 72,12 Q 96,-2 120,12" stroke="#00F0FF" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Visor Serat Optik HUD Data Cyan -->
  <rect x="50" y="66" width="90" height="28" rx="6" fill="#0A0A0A" />
  <rect x="48" y="64" width="90" height="28" rx="6" fill="#00F0FF" stroke="#0A0A0A" stroke-width="4" />
  <line x1="56" y1="74" x2="80" y2="74" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" />
  <line x1="56" y1="80" x2="72" y2="80" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="94" cy="78" r="4" fill="#0A0A0A" />
  <circle cx="95.5" cy="76.5" r="1.5" fill="#FFFFFF" />
  <circle cx="120" cy="78" r="4" fill="#0A0A0A" />
  <circle cx="121.5" cy="76.5" r="1.5" fill="#FFFFFF" />

  <!-- Senyum Tegas & Pipi Pink -->
  <path d="M84,116 Q94,124 104,116" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <rect x="46" y="106" width="10" height="6" rx="2" fill="#FF5C8A" />
  <rect x="132" y="106" width="10" height="6" rx="2" fill="#FF5C8A" />

  <!-- Sabuk Port Switch Ethernet -->
  <rect x="48" y="132" width="92" height="10" fill="#0A0A0A" />
  <rect x="56" y="134" width="8" height="6" fill="#2EE59D" />
  <rect x="70" y="134" width="8" height="6" fill="#2EE59D" />
  <rect x="84" y="134" width="8" height="6" fill="#2EE59D" />
  <rect x="98" y="134" width="8" height="6" fill="#00F0FF" />

  <!-- Tangan Kanan Memegang Kepala Kabel LAN RJ45 Emas -->
  <line x1="146" y1="110" x2="164" y2="124" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" />
  <circle cx="164" cy="122" r="6" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3.5" />
  <g transform="translate(156, 78) rotate(15)">
    <rect x="3" y="3" width="22" height="34" rx="4" fill="#0A0A0A" />
    <rect x="0" y="0" width="22" height="34" rx="4" fill="#00F0FF" stroke="#0A0A0A" stroke-width="3" />
    <path d="M 7,0 L 11,-8 L 15,0" stroke="#0A0A0A" stroke-width="2.5" fill="#FFFFFF" />
    <line x1="4" y1="28" x2="4" y2="34" stroke="#FFD60A" stroke-width="2" />
    <line x1="8" y1="28" x2="8" y2="34" stroke="#FFD60A" stroke-width="2" />
    <line x1="12" y1="28" x2="12" y2="34" stroke="#FFD60A" stroke-width="2" />
    <line x1="16" y1="28" x2="16" y2="34" stroke="#FFD60A" stroke-width="2" />
  </g>
  <path d="M 166,112 Q 190,135 180,155 Q 165,170 148,154" stroke="#00F0FF" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M 166,112 Q 190,135 180,155 Q 165,170 148,154" stroke="#0A0A0A" stroke-width="1.5" fill="none" stroke-dasharray="3 3" />

  <!-- Tangan Kiri Memegang Cable Tester LED -->
  <g transform="translate(12, 94)">
    <line x1="28" y1="18" x2="14" y2="28" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" />
    <circle cx="16" cy="28" r="6" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3.5" />
    <rect x="2" y="2" width="22" height="42" rx="4" fill="#0A0A0A" />
    <rect x="0" y="0" width="22" height="42" rx="4" fill="#FF5C8A" stroke="#0A0A0A" stroke-width="2.5" />
    <circle cx="6" cy="10" r="2" fill="#2EE59D" />
    <circle cx="11" cy="10" r="2" fill="#2EE59D" />
    <circle cx="16" cy="10" r="2" fill="#2EE59D" />
    <circle cx="6" cy="18" r="2" fill="#2EE59D" />
    <circle cx="11" cy="18" r="2" fill="#2EE59D" />
    <circle cx="16" cy="18" r="2" fill="#2EE59D" />
    <circle cx="6" cy="26" r="2" fill="#2EE59D" />
    <circle cx="11" cy="26" r="2" fill="#2EE59D" />
    <rect x="4" y="32" width="14" height="4" fill="#0A0A0A" />
  </g>

  <!-- Badge "1 Gbps LINK" -->
  <g transform="translate(144, 28)">
    <rect x="3" y="3" width="38" height="18" rx="4" fill="#0A0A0A" />
    <rect x="0" y="0" width="38" height="18" rx="4" fill="#2EE59D" stroke="#0A0A0A" stroke-width="2" />
    <text x="4" y="13" font-family="monospace" font-size="8" font-weight="900" fill="#0A0A0A">1Gbps⚡</text>
  </g>
</svg>
