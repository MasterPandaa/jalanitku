    <rect x="176" y="126" width="6" height="11" rx="1.5" fill="#244265" stroke="#0A0A0A" stroke-width="2" transform="rotate(-15 176 126)" />
    <circle cx="180" cy="130" r="1.2" fill="#E2E8F0" />

