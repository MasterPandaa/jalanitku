<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MASKOT MOBILE DEVELOPER — "THE SCREEN TAPPER" -->
  <!-- Proyek: JalanITku · Sutradara Visual: Matatabi -->

  <!-- Hard Shadow Kaki -->
  <rect x="68" y="154" width="22" height="24" fill="#0A0A0A" />
  <rect x="114" y="154" width="22" height="24" fill="#0A0A0A" />

  <!-- Kaki Kiri -->
  <rect x="64" y="148" width="22" height="26" fill="#0A0A0A" rx="2" stroke="#0A0A0A" stroke-width="3.5" />
  <line x1="64" y1="170" x2="86" y2="170" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square" />

  <!-- Kaki Kanan -->
  <rect x="110" y="148" width="22" height="26" fill="#0A0A0A" rx="2" stroke="#0A0A0A" stroke-width="3.5" />
  <line x1="110" y1="170" x2="132" y2="170" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square" />

  <!-- Hard Shadow Badan -->
  <rect x="48" y="56" width="106" height="94" rx="4" fill="#0A0A0A" />

  <!-- Badan Papan Rambu Kuning -->
  <rect x="42" y="50" width="106" height="94" rx="4" fill="#FFD60A" stroke="#0A0A0A" stroke-width="4" />

  <!-- Marka Jalan Putus-Putus -->
  <line x1="54" y1="134" x2="136" y2="134" stroke="#0A0A0A" stroke-width="3.5" stroke-dasharray="8 6" />

  <!-- Pipi Merona Pink -->
  <rect x="52" y="106" width="12" height="7" rx="2" fill="#FF5C8A" />
  <rect x="122" y="106" width="12" height="7" rx="2" fill="#FF5C8A" />

  <!-- Mata Kiri -->
  <rect x="58" y="76" width="20" height="24" rx="4" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3.5" />
  <rect x="66" y="82" width="9" height="12" rx="2" fill="#0A0A0A" />
  <circle cx="68.5" cy="84.5" r="1.5" fill="#FFFFFF" />
  <circle cx="72" cy="89.5" r="1.2" fill="#00F0FF" />

  <!-- Mata Kanan -->
  <rect x="96" y="76" width="20" height="24" rx="4" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3.5" />
  <rect x="105" y="82" width="9" height="12" rx="2" fill="#0A0A0A" />
  <circle cx="107.5" cy="84.5" r="1.5" fill="#FFFFFF" />
  <circle cx="111" cy="89.5" r="1.2" fill="#00F0FF" />

  <!-- Alis Keren -->
  <path d="M 56 70 L 78 72" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round" />
  <path d="M 98 72 L 118 69" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round" />

  <!-- Mulut Senyum Terbuka -->
  <path d="M 82 112 Q 90 122 98 112 Z" fill="#FF5C8A" stroke="#0A0A0A" stroke-width="3" stroke-linejoin="round" />
  <rect x="85" y="112" width="10" height="3" fill="#FFFFFF" />

  <!-- Topi Snapback Miring Pink & Cyan -->
  <path d="M 44 46 C 44 22 136 22 136 46 Z" fill="#0A0A0A" />
  <path d="M 44 42 C 44 18 134 18 134 42 Z" fill="#FF5C8A" stroke="#0A0A0A" stroke-width="4" />
  <polygon points="24,38 92,38 88,46 20,46" fill="#00F0FF" stroke="#0A0A0A" stroke-width="3.5" stroke-linejoin="round" />
  <circle cx="89" cy="18" r="4.5" fill="#FFD60A" stroke="#0A0A0A" stroke-width="2.5" />
  <rect x="84" y="26" width="10" height="13" rx="2" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" />
  <circle cx="89" cy="35" r="1" fill="#0A0A0A" />

  <!-- Lengan Kiri & Smartphone Raksasa -->
  <path d="M 124 122 Q 138 132 144 120" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" fill="none" />
  <rect x="132" y="58" width="54" height="96" rx="8" fill="#0A0A0A" />
  <rect x="126" y="52" width="54" height="96" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4" />
  <rect x="130" y="56" width="46" height="88" rx="5" fill="#18181B" stroke="#0A0A0A" stroke-width="2" />
  <rect x="145" y="60" width="16" height="4.5" rx="2.2" fill="#0A0A0A" />

  <!-- Antarmuka Aplikasi di Layar Smartphone -->
  <rect x="134" y="69" width="38" height="16" rx="3" fill="#FF5C8A" stroke="#0A0A0A" stroke-width="1.5" />
  <line x1="138" y1="74" x2="154" y2="74" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="138" y1="79" x2="162" y2="79" stroke="#FFD60A" stroke-width="1.5" stroke-linecap="round" />
  <rect x="135" y="90" width="10" height="10" rx="2.5" fill="#2EE59D" stroke="#0A0A0A" stroke-width="1.5" />
  <rect x="149" y="90" width="10" height="10" rx="2.5" fill="#00F0FF" stroke="#0A0A0A" stroke-width="1.5" />
  <rect x="163" y="90" width="8" height="10" rx="2.5" fill="#FF8A3D" stroke="#0A0A0A" stroke-width="1.5" />
  <rect x="135" y="106" width="36" height="18" rx="3" fill="#00F0FF" stroke="#0A0A0A" stroke-width="1.5" />
  <rect x="138" y="110" width="16" height="4" rx="1" fill="#0A0A0A" />
  <circle cx="162" cy="115" r="3.5" fill="#2EE59D" stroke="#0A0A0A" stroke-width="1" />
  <line x1="145" y1="138" x2="161" y2="138" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="140" cy="124" r="7" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3.5" />

  <!-- Cincin Touch Ripple & Sparkle Sentuhan -->
  <circle cx="132" cy="104" r="8" fill="none" stroke="#00F0FF" stroke-width="2.5" />
  <circle cx="132" cy="104" r="16" fill="none" stroke="#2EE59D" stroke-width="2" stroke-dasharray="4 3" />
  <polygon points="132,98 134,103 139,104 134,105 132,110 130,105 125,104 130,103" fill="#FFD60A" stroke="#0A0A0A" stroke-width="1.5" />

  <!-- Lengan & Jari Tapping Pose -->
  <path d="M 44 116 Q 80 114 116 106" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="114" cy="106" r="8" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3.5" />
  <path d="M 118 102 L 132 103 L 130 108 L 118 107 Z" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3" stroke-linejoin="round" />
  <path d="M 112 100 Q 116 94 122 96" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Sinyal Nirkabel Wi-Fi di Sisi Kiri -->
  <path d="M 22 68 A 12 12 0 0 1 38 68" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 26 72 A 6 6 0 0 1 34 72" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="30" cy="76" r="2" fill="#FF5C8A" stroke="#0A0A0A" stroke-width="1.5" />
</svg>
