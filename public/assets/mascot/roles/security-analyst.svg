<svg viewBox="0 0 200 200" width="200" height="200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- MASKOT CYBERSECURITY / SECURITY ANALYST — "THE WARDEN" -->
  <!-- Proyek: JalanITku · Sutradara Visual: Matatabi -->
  <!-- Standar: 4 Aturan Baku Maskot GEMINI.md (Kuning Rambu Base #FFD60A, Rompi Benteng Ungu #7C3AED, Mata Baku JalanMin, Zero-Float) -->

  <!-- LAYER 1: SEPATU BAJA BENTENG NEO-BRUTALISM DENGAN SOL UNGU -->
  <rect x="68" y="154" width="22" height="24" fill="#0A0A0A" />
  <rect x="114" y="154" width="22" height="24" fill="#0A0A0A" />

  <rect x="64" y="148" width="22" height="26" fill="#0A0A0A" rx="2" stroke="#0A0A0A" stroke-width="3.5" />
  <line x1="64" y1="170" x2="86" y2="170" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="square" />

  <rect x="110" y="148" width="22" height="26" fill="#0A0A0A" rx="2" stroke="#0A0A0A" stroke-width="3.5" />
  <line x1="110" y1="170" x2="132" y2="170" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="square" />

  <!-- LAYER 2: BADAN UTAMA KUNING RAMBU BASE JALANMIN (106x94 rx=4) -->
  <rect x="48" y="56" width="106" height="94" rx="4" fill="#0A0A0A" />
  <rect x="42" y="50" width="106" height="94" rx="4" fill="#FFD60A" stroke="#0A0A0A" stroke-width="4" />

  <!-- Marka Jalan Putus-Putus Perut -->
  <line x1="54" y1="134" x2="136" y2="134" stroke="#0A0A0A" stroke-width="3.5" stroke-dasharray="8 6" />

  <!-- Pipi Merona Pink (#FF5C8A) -->
  <rect x="52" y="104" width="12" height="7" rx="2" fill="#FF5C8A" />
  <rect x="124" y="104" width="12" height="7" rx="2" fill="#FF5C8A" />

  <!-- LAYER 3: ROMPI / ARMOR BENTENG CYBER UNGU (#7C3AED) -->
  <polygon points="42,122 84,124 78,144 42,144" fill="#7C3AED" stroke="#0A0A0A" stroke-width="3.5" stroke-linejoin="round" />
  <polygon points="106,124 148,122 148,144 112,144" fill="#7C3AED" stroke="#0A0A0A" stroke-width="3.5" stroke-linejoin="round" />
  <polygon points="84,124 106,124 102,144 88,144" fill="#5B21B6" stroke="#0A0A0A" stroke-width="2.5" stroke-linejoin="round" />
  <line x1="48" y1="133" x2="72" y2="133" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" />
  <line x1="118" y1="133" x2="142" y2="133" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="95" cy="134" r="2.5" fill="#10B981" stroke="#0A0A0A" stroke-width="1" />

  <!-- LAYER 4: MATA BAKU JALANMIN (22x24 rx=4) & ALIS WASPADA -->
  <rect x="58" y="76" width="22" height="24" rx="4" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3.5" />
  <rect x="64" y="81" width="11" height="13" rx="2" fill="#0A0A0A" />
  <circle cx="67" cy="84" r="1.5" fill="#FFFFFF" />
  <circle cx="70" cy="88" r="1.2" fill="#00F0FF" />

  <rect x="102" y="76" width="22" height="24" rx="4" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3.5" />
  <rect x="108" y="81" width="11" height="13" rx="2" fill="#0A0A0A" />
  <circle cx="111" cy="84" r="1.5" fill="#FFFFFF" />
  <circle cx="114" cy="88" r="1.2" fill="#00F0FF" />

  <line x1="56" y1="67" x2="80" y2="70" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round" />
  <line x1="102" y1="70" x2="126" y2="67" stroke="#0A0A0A" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 85,114 Q 95,122 105,114" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" fill="none" />

