  <g id="tactical-hud-glasses">
    <rect x="52" y="72" width="84" height="28" rx="4" fill="#10B981" fill-opacity="0.32" />
    <rect x="50" y="70" width="88" height="32" rx="5" fill="none" stroke="#0A0A0A" stroke-width="3.5" />
    <rect x="88" y="74" width="12" height="6" rx="1.5" fill="#0A0A0A" />
    <circle cx="94" cy="77" r="1.5" fill="#10B981" />
    <line x1="54" y1="78" x2="134" y2="78" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2" opacity="0.8" />
    <line x1="54" y1="92" x2="134" y2="92" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2" opacity="0.8" />
    <text x="56" y="86" font-family="monospace" font-size="6.5" font-weight="900" fill="#10B981" opacity="0.95">0_THREAT</text>
    <circle cx="124" cy="86" r="4.5" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="2 2" opacity="0.85" />
    <circle cx="124" cy="86" r="1.5" fill="#10B981" opacity="0.95" />
  </g>

  <!-- LAYER 6: HELM TANTANGAN CYBER WARDEN BERTANDUK BAJA -->
  <g transform="translate(25, 8)">
    <path d="M 12,46 L 24,14 L 38,26 L 102,26 L 116,14 L 128,46 Z" fill="#0A0A0A" />
    <path d="M 10,42 L 22,12 L 36,24 L 100,24 L 114,12 L 126,42 Z" fill="#7C3AED" stroke="#0A0A0A" stroke-width="4" stroke-linejoin="round" />
    <polygon points="12,24 22,12 20,28" fill="#10B981" stroke="#0A0A0A" stroke-width="2.5" />
    <polygon points="124,24 114,12 116,28" fill="#10B981" stroke="#0A0A0A" stroke-width="2.5" />
    <polygon points="46,24 90,24 82,34 54,34" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5" />
  </g>

  <!-- LAYER 7: TANGAN KIRI MEMEGANG PERISAI FIREWALL (AEGIS SHIELD) -->
  <g transform="translate(6, 78)">
    <line x1="32" y1="38" x2="18" y2="44" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" />
    <circle cx="18" cy="44" r="6" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3.5" />
    <g transform="translate(-10, 10)">
      <polygon points="18,0 44,0 52,28 31,58 10,28" fill="#0A0A0A" />
      <polygon points="15,-3 41,-3 49,25 28,55 7,25" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3.5" stroke-linejoin="round" />
      <polygon points="19,4 37,4 43,24 28,46 13,24" fill="#7C3AED" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round" />
      <g transform="translate(21, 14)">
        <path d="M 4,4 C 4,-2 10,-2 10,4" stroke="#0A0A0A" stroke-width="2.5" fill="none" />
        <rect x="1" y="4" width="12" height="10" rx="2" fill="#FFD60A" stroke="#0A0A0A" stroke-width="2" />
        <circle cx="7" cy="8" r="1.5" fill="#10B981" />
        <line x1="7" y1="9" x2="7" y2="12" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- LAYER 8: TANGAN KANAN MEMEGANG CYBER KEY BLADE -->
  <g transform="translate(148, 92)">
    <line x1="-2" y1="28" x2="16" y2="34" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round" />
    <circle cx="16" cy="34" r="6" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3.5" />
    <g transform="translate(18, 22) rotate(24)">
      <polygon points="0,0 6,-38 12,0 8,14 4,14" fill="#0A0A0A" />
      <rect x="3" y="2" width="6" height="14" rx="2" fill="#FFD60A" stroke="#0A0A0A" stroke-width="2" />
      <rect x="-4" y="0" width="20" height="5" rx="1.5" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" />
      <polygon points="-1,-2 6,-40 13,-2 10,0 2,0" fill="#10B981" stroke="#0A0A0A" stroke-width="2.5" stroke-linejoin="round" />
      <rect x="10" y="-24" width="5" height="3" fill="#10B981" stroke="#0A0A0A" stroke-width="1.5" />
      <rect x="10" y="-14" width="4" height="3" fill="#10B981" stroke="#0A0A0A" stroke-width="1.5" />
      <line x1="6" y1="-2" x2="6" y2="-32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
