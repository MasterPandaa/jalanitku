                <g clip-path="url(#clipCoatLeft-happy)" fill="#FFD21E">
                    <ellipse cx="256" cy="614" rx="10" ry="13" transform="rotate(18 256 614)"></ellipse>
                    <ellipse cx="290" cy="574" rx="9" ry="12" transform="rotate(15 290 574)"></ellipse>
