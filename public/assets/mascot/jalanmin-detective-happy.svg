                        <ellipse cx="688" cy="656" rx="10" ry="13" transform="rotate(-16 688 656)"></ellipse>
                        <ellipse cx="704" cy="552" rx="9" ry="12" transform="rotate(-22 704 552)"></ellipse>
                        <ellipse cx="730" cy="502" rx="9" ry="12" transform="rotate(-18 730 502)"></ellipse>
                        <ellipse cx="756" cy="544" rx="9" ry="12" transform="rotate(15 756 544)"></ellipse>
                    </g>
                    <path class="stk" fill="none" d="M 505,550 C 580,562 662,538 724,462 L 796,534 L 710,606 L 726,672 C 668,700 595,708 538,704 C 518,702 510,684 510,668 L 505,550 Z"></path>
                </g>
            </g>

            <g id="collarAndCapelet">
                <path class="stk" fill="#8F4012" d="M 284,432 C 282,414 304,408 320,418 L 322,456 Z"></path>
                <path class="stk" fill="#8F4012" d="M 692,422 C 694,406 674,400 660,410 L 658,448 Z"></path>
                <path class="stk" fill="#FF7E26" d="M 284,492 C 226,528 190,584 176,648 C 218,582 288,566 378,582 C 442,592 484,580 505,550 C 425,550 338,530 284,492 Z"></path>
                <path class="stk" fill="#FF7E26" d="M 505,550 C 548,590 628,588 674,552 C 702,530 718,494 724,462 C 690,478 638,518 505,550 Z"></path>
                <path class="stk" fill="#D96B1B" d="M 284,432 C 314,458 368,476 436,482 C 464,485 476,496 484,518 L 498,550 C 412,552 332,534 290,498 L 284,432 Z"></path>
                <path class="stk" fill="#D96B1B" d="M 692,422 C 664,448 614,468 564,476 C 538,480 526,492 520,516 L 512,550 C 594,548 660,530 688,490 L 692,422 Z"></path>
            </g>

            <g class="anim-hat">
                <path class="stk" fill="#FF4B72" d="M 318,314 C 282,340 264,368 272,384 C 280,398 312,394 330,368 C 336,350 332,328 318,314 Z"></path>
                <path class="stk" fill="#FF4B72" d="M 312,318 C 308,192 388,120 490,122 C 578,124 620,192 624,264 C 535,258 415,280 312,318 Z"></path>
                <path d="M 442,126 C 400,174 392,235 398,286" fill="none" stroke="#080808" stroke-width="14" stroke-linecap="round"></path>
                <path class="stk" fill="#FF4B72" d="M 396,288 C 462,242 598,234 656,268 C 678,282 666,306 616,312 C 532,322 446,316 396,288 Z"></path>
                <g class="anim-bow">
