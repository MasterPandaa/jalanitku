                <path d="M 402,786 L 478,790" stroke="#080808" stroke-width="11" stroke-linecap="round"></path>
                <path d="M 542,790 L 618,786" stroke="#080808" stroke-width="11" stroke-linecap="round"></path>

                <path class="stk" fill="#F26419" d="M 386,805 L 382,846 C 338,856 324,894 352,912 C 392,922 462,920 492,908 C 500,894 498,822 494,808 C 458,816 420,814 386,805 Z"></path>
