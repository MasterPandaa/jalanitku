            </g>

            <g id="faceFeatures">
                <g>
                    <circle class="stk-med" cx="454" cy="396" r="52" fill="#FFFFFF"></circle>
                    <circle class="stk-med" cx="574" cy="396" r="52" fill="#FFFFFF"></circle>
                    <g>
                        <circle cx="458" cy="394" r="32" fill="#080808"></circle>
