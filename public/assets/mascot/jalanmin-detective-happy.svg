                    <ellipse cx="428" cy="582" rx="10" ry="13" transform="rotate(22 428 582)"></ellipse>
                    <ellipse cx="436" cy="650" rx="10" ry="14" transform="rotate(12 436 650)"></ellipse>
                    <ellipse cx="480" cy="610" rx="10" ry="13" transform="rotate(20 480 610)"></ellipse>
                    <ellipse cx="476" cy="682" rx="10" ry="13" transform="rotate(24 476 682)"></ellipse>
                </g>
                <path class="stk" fill="none" d="M 505,550 C 425,565 340,562 258,552 L 222,646 L 312,676 L 336,602 L 315,692 C 368,714 438,716 488,708 C 504,705 508,685 508,668 L 505,550 Z"></path>
            </g>

            <g class="anim-magnifier-arm">
                <path class="stk" fill="#FFD21E" d="M 718,478 L 762,412 C 776,392 802,394 812,416 L 832,492 L 774,536 Z"></path>
                <g id="magnifyingGlass" transform="rotate(-15 780 275)">
                    <rect class="stk" x="761" y="365" width="38" height="158" rx="19" fill="#9A4B1A"></rect>
                    <circle class="stk" cx="780" cy="275" r="104" fill="#9A4B1A"></circle>
                    <circle class="stk" cx="780" cy="275" r="78" fill="#FFFFFF"></circle>
                    <path class="anim-glint" d="M 786,216 C 818,220 838,242 842,268" fill="none" stroke="#080808" stroke-width="13" stroke-linecap="round"></path>
                </g>
                <path class="stk" fill="#FFD21E" d="M 812,394 C 848,384 878,414 872,456 C 866,486 840,496 818,478 C 802,462 798,422 812,394 Z"></path>
                <path class="stk" fill="#FFD21E" d="M 754,424 C 766,396 808,398 814,424 C 818,442 798,452 772,444"></path>

                <g id="coatRight">
                    <path class="stk" fill="#DE6C18" d="M 505,550 C 580,562 662,538 724,462 L 796,534 L 710,606 L 726,672 C 668,700 595,708 538,704 C 518,702 510,684 510,668 L 505,550 Z"></path>
                    <g clip-path="url(#clipCoatRight-happy)" fill="#FFD21E">
                        <ellipse cx="552" cy="612" rx="10" ry="14" transform="rotate(-12 552 612)"></ellipse>
                        <ellipse cx="564" cy="676" rx="10" ry="13" transform="rotate(14 564 676)"></ellipse>
                        <ellipse cx="618" cy="638" rx="10" ry="14" transform="rotate(-8 618 638)"></ellipse>
