                <path class="stk" fill="#FFD21E" d="M 230,638 C 198,678 202,732 242,746 C 270,755 290,736 294,718 C 308,728 322,718 320,698 C 318,680 306,660 292,648 Z"></path>
            </g>
            <g id="coatLeft">
