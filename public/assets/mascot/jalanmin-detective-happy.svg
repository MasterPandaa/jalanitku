<svg id="detectiveSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" role="img" aria-label="Detektif JalanMin state happy">
    <defs>
        <filter id="comic-shadow-happy" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="18" dy="18" stdDeviation="0" flood-color="#080808" flood-opacity="1"></feDropShadow>
        </filter>

        <style>
            .stk { stroke: #080808; stroke-width: 14px; stroke-linecap: round; stroke-linejoin: round; }
            .stk-med { stroke: #080808; stroke-width: 12.5px; stroke-linecap: round; stroke-linejoin: round; }
            .comic-drop-shadow { filter: url(#comic-shadow-happy); }

            @keyframes actionHappyJump {
                0%, 100% { transform: translateY(0) scale(1, 1); }
                20% { transform: translateY(22px) scale(1.06, 0.92); }
                45% { transform: translateY(-54px) scale(0.95, 1.06); }
                75% { transform: translateY(10px) scale(1.03, 0.97); }
            }
            @keyframes capeWave {
                0%, 100% { transform: rotate(0deg) scaleX(1); }
                50% { transform: rotate(-2deg) scaleX(1.04); }
            }
            @keyframes hatBob {
                0%, 100% { transform: translateY(0px) rotate(0deg); }
                50% { transform: translateY(-12px) rotate(-3deg); }
            }
            @keyframes bowWiggle {
                0%, 100% { transform: rotate(0deg) scale(1); }
                50% { transform: rotate(10deg) scale(1.1); }
            }
            @keyframes leftArmSwing {
                0%, 100% { transform: rotate(0deg); }
                50% { transform: rotate(-12deg); }
            }
            @keyframes magnifyHappy {
                0%, 100% { transform: rotate(0deg); }
                50% { transform: translateY(-16px) rotate(-8deg); }
            }
            @keyframes lensGlint {
                0%, 100% { opacity: 1; transform: scale(1); }
                50% { opacity: 0.75; transform: scale(0.96); }
            }

            .anim-character-body {
                transform-box: view-box;
                transform-origin: 505px 860px;
                animation: actionHappyJump 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
            }
            .anim-cape {
                transform-box: view-box;
                transform-origin: 505px 480px;
                animation: capeWave 0.85s ease-in-out infinite;
            }
            .anim-hat {
                transform-box: view-box;
                transform-origin: 485px 295px;
                animation: hatBob 0.85s ease-in-out infinite;
            }
            .anim-bow {
                transform-box: view-box;
                transform-origin: 438px 124px;
                animation: bowWiggle 0.85s ease-in-out infinite;
            }
            .anim-left-arm {
                transform-box: view-box;
                transform-origin: 295px 590px;
                animation: leftArmSwing 0.85s ease-in-out infinite;
            }
            .anim-magnifier-arm {
                transform-box: view-box;
                transform-origin: 685px 490px;
                animation: magnifyHappy 0.85s ease-in-out infinite;
            }
            .anim-glint {
                transform-box: view-box;
                transform-origin: 780px 275px;
                animation: lensGlint 1.2s ease-in-out infinite;
            }
        </style>

        <clipPath id="clipCoatLeft-happy">
            <path d="M 505,550 C 425,565 340,562 258,552 L 222,646 L 312,676 L 336,602 L 315,692 C 368,714 438,716 488,708 C 504,705 508,685 508,668 L 505,550 Z"></path>
        </clipPath>

        <clipPath id="clipCoatRight-happy">
            <path d="M 505,550 C 580,562 662,538 724,462 L 796,534 L 710,606 L 726,672 C 668,700 595,708 538,704 C 518,702 510,684 510,668 L 505,550 Z"></path>
        </clipPath>
    </defs>

    <g class="comic-drop-shadow">
        <g class="anim-character-body">
            <g class="anim-cape">
