<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hard drop shadow -->
  <rect x="8" y="12" width="42" height="42" rx="8" fill="#0A0A0A" />
  
  <!-- Main yellow face body -->
  <rect x="5" y="9" width="42" height="42" rx="8" fill="#FFD60A" stroke="#0A0A0A" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Dashed sign divider at bottom -->
  <line x1="11" y1="43" x2="41" y2="43" stroke="#0A0A0A" stroke-width="2.5" stroke-dasharray="3.5 2.5" />
  
  <!-- Detective Deerstalker Hat -->
  <!-- Hat crown dome -->
  <path d="M12 11 C12 3 40 3 40 11 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Hat brim / visor -->
  <path d="M3 12 C3 12 12 8 26 8 C40 8 49 12 49 12" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <!-- Hat ribbon band (Cyan) -->
  <path d="M14 10 C18 8.5 34 8.5 38 10" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  <!-- Hat top bow/knot (Pink) -->
  <circle cx="26" cy="4" r="2.5" fill="#FF5C8A" stroke="#0A0A0A" stroke-width="1.5" />
  
  <!-- Left Eye -->
  <rect x="13" y="20" width="9" height="12" rx="2.5" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5" />
  <rect x="16" y="23" width="4.5" height="6.5" rx="1.5" fill="#0A0A0A" />
  <circle cx="17.5" cy="24.5" r="1" fill="#FFFFFF" />
  
  <!-- Right Eye -->
  <rect x="29" y="20" width="9" height="12" rx="2.5" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5" />
  <rect x="31" y="23" width="4.5" height="6.5" rx="1.5" fill="#0A0A0A" />
  <circle cx="32.5" cy="24.5" r="1" fill="#FFFFFF" />
  
  <!-- Cheeks (Pink) -->
  <rect x="9" y="30" width="4" height="2.5" rx="1" fill="#FF5C8A" />
  <rect x="38" y="30" width="4" height="2.5" rx="1" fill="#FF5C8A" />
  
  <!-- Detective Smile / Curious Smirk -->
  <path d="M22 34 Q26 37 30 34" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Mini Cyan Tie Collar -->
  <polygon points="23,45 29,45 26,42" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5" stroke-linejoin="round" />
  <polygon points="24,45 28,45 29,50 26,52 23,50" fill="#00F0FF" stroke="#0A0A0A" stroke-width="1.5" />
  
  <!-- Detective Magnifying Glass (positioned dynamically on bottom right) -->
  <!-- Glass shadow -->
  <circle cx="48" cy="40" r="11" fill="#0A0A0A" />
  <!-- Glass rim and lens -->
  <circle cx="45" cy="37" r="10" fill="#00F0FF" stroke="#0A0A0A" stroke-width="3" />
  <!-- Lens specular highlight -->
  <path d="M40 32 C43 29 47 29 50 31" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Handle shadow -->
  <line x1="52" y1="46" x2="60" y2="55" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" />
  <!-- Handle colored bar -->
  <line x1="50" y1="44" x2="58" y2="53" stroke="#FF5C8A" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="44" x2="58" y2="53" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 3" />
</svg>
